name: Deploy web PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'm-engine-web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow one deploy at a time; let an in-flight run finish rather than cancelling
# it, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m-engine-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: m-engine-web/package-lock.json

      - run: npm ci

      # The site is served from https://<owner>.github.io/<repo>/, so every asset
      # URL needs that prefix. Derived from the repo name rather than hardcoded.
      - name: Build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify PWA output
        run: |
          test -f dist/index.html || { echo "::error::no index.html"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::no manifest"; exit 1; }
          test -f dist/sw.js || { echo "::error::no service worker"; exit 1; }
          for i in icon-192 icon-512 icon-maskable-512; do
            test -f "dist/icons/$i.png" || { echo "::error::missing icon $i"; exit 1; }
          done
          echo "PWA output verified"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: m-engine-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
